[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfr-reloaded"
version = "4.0.0"
description = "Subdomain discovery via Certificate Transparency logs"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "MrGuillote" }]
keywords = ["security", "subdomain", "certificate-transparency", "recon", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
ctfr-reloaded = "ctfr_reloaded.cli:main"

[project.urls]
Homepage = "https://github.com/MrGuillote/ctfr-reloaded"
Source = "https://github.com/MrGuillote/ctfr-reloaded"

[tool.setuptools.packages.find]
include = ["ctfr_reloaded*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
