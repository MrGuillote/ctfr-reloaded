[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfr-reloaded"
version = "4.2.3"
description = "100% free subdomain discovery — no API keys required"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "MrGuillote" }]
keywords = ["security", "subdomain", "certificate-transparency", "recon", "osint", "bug-bounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "dnspython>=2.4.0",
    "tqdm>=4.66.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.27.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
# Extras legacy (vacios): todo lo del usuario final ya viene en la instalacion base
api = []
pdf = []
dev = ["pytest>=7.0", "pytest-mock>=3.10", "responses>=0.25.0"]
all = ["ctfr-reloaded[dev]"]

[project.scripts]
ctfr-reloaded = "ctfr_reloaded.cli:main"

[project.urls]
Homepage = "https://github.com/MrGuillote/ctfr-reloaded"
Source = "https://github.com/MrGuillote/ctfr-reloaded"
Issues = "https://github.com/MrGuillote/ctfr-reloaded/issues"
Changelog = "https://github.com/MrGuillote/ctfr-reloaded/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ctfr_reloaded*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ctfr_reloaded = ["py.typed"]
